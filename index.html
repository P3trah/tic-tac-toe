<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dialogue-box">
        <h1>Select Player Name</h1>

        <fieldset>
        <label for="player1">Player 1:</label>
        <input type="text" name="Player 1 " id="player1" placeholder="Enter Player 1 Name">
        </fieldset>

        <fieldset>
        <label for="player2">Player 2:</label>
        <input type="text" name="Player 2" id="player2" placeholder="Enter Player 2 Name">
        </fieldset>

        <button type="submit" id="submitbutton">Confirm</button>
    </div>
    <div class="game-container">
        <h1>Tic Tac Toe</h1>
    
    <div class="grid">
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
    </div> 
    <button id="Reset">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
